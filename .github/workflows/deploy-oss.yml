# 部署到阿里云 OSS 静态网站托管
#
# 触发方式：
#   - 每次 push 到 main 分支
#   - 或在 Actions 页面手动运行（workflow_dispatch）
#
# 需要的 GitHub Secrets（Settings -> Secrets and variables -> Actions）：
#   ALIYUN_ACCESS_KEY_ID      阿里云 AccessKey ID（建议用 RAM 子账号，仅授予 OSS 权限）
#   ALIYUN_ACCESS_KEY_SECRET  阿里云 AccessKey Secret
#   ALIYUN_OSS_BUCKET         OSS Bucket 名称，例如 my-manual
#   ALIYUN_OSS_ENDPOINT       Bucket 所在地域的外网 Endpoint，
#                             例如 https://oss-cn-hangzhou.aliyuncs.com
#
# 部署后在 OSS 控制台开启「静态网站托管」：
#   默认首页: index.html
#   默认404页: 404.html
#   并绑定已备案的自定义域名。

name: 部署到阿里云 OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oss
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        run: npm run docs:build

      - name: 安装 ossutil
        run: |
          curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil --version

      - name: 配置 ossutil（凭据来自 GitHub Secrets）
        run: |
          cat > ~/.ossutilconfig <<EOF
          [Credentials]
          language=CH
          endpoint=${{ secrets.ALIYUN_OSS_ENDPOINT }}
          accessKeyID=${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          accessKeySecret=${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          stsToken=
          EOF

      - name: 上传到 OSS
        run: |
          ossutil cp -rf docs/.vitepress/dist/ oss://${{ secrets.ALIYUN_OSS_BUCKET }}/
